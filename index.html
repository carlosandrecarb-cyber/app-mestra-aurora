<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Escola</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; color: #333; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 480px; min-height: 100vh; background-color: #ffffff; box-shadow: 0 0 20px rgba(0,0,0,0.05); position: relative; }
        
        /* Cabeçalho */
        header { background-color: #004aad; color: white; padding: 20px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: background-color 0.5s; }
        
        #logo-escola { 
            width: 100%; max-width: 400px; height: auto; max-height: 130px; object-fit: contain; 
            border-radius: 8px; margin-bottom: 12px; background-color: white; padding: 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); 
        }
        header h1 { font-size: 1.3rem; font-weight: 600; }
        
        /* Área dos Blocos (Menu Principal) */
        #menu-blocos { padding: 25px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .bloco { background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 15px; padding: 25px 10px; text-align: center; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .bloco:active { transform: scale(0.95); background-color: #e2e6ea; }
        .bloco-icone { font-size: 2.8rem; margin-bottom: 12px; }
        .bloco-titulo { font-size: 0.95rem; font-weight: 600; color: #495057; }
        
        /* Novas Telas (Conteúdo) */
        #tela-conteudo { display: none; padding: 20px; }
        .btn-voltar { background: none; border: none; color: #004aad; font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 20px; display: flex; align-items: center; gap: 5px; }
        .titulo-tela { font-size: 1.4rem; color: #212529; margin-bottom: 15px; border-bottom: 2px solid #e9ecef; padding-bottom: 10px; }
        
        /* Estilo dos Avisos */
        .cartao-aviso { background-color: #fff; border-left: 4px solid #ffc107; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .aviso-data { display: block; font-size: 0.8rem; color: #6c757d; margin-bottom: 8px; font-weight: 600; }
        .aviso-texto { font-size: 1rem; color: #333; line-height: 1.4; }
        .aviso-link { display: inline-block; margin-top: 10px; font-size: 0.9rem; color: #004aad; text-decoration: none; font-weight: 600; }
        
        #loading { text-align: center; padding: 50px; color: #6c757d; font-size: 1rem; grid-column: span 2;}
    </style>
</head>
<body>

<div id="app">
    <header id="cabecalho">
        <div id="loading-header">Carregando dados...</div>
    </header>

    <!-- Tela 1: Menu de Botões -->
    <div id="menu-blocos">
        <div id="loading">Conectando à planilha...</div>
    </div>

    <!-- Tela 2: Onde os dados vão aparecer (Avisos, Provas, etc) -->
    <div id="tela-conteudo">
        <button class="btn-voltar" onclick="voltarMenu()" id="btn-voltar-cor">⬅ Voltar ao Menu</button>
        <div id="conteudo-dinamico"></div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxfewC2cAeLK3ULrRcOP72E0KUqoteBNgw2TI5GUOl4WFYhQLIQoJNOWsLOFMl-zOIQzg/exec";
    let corEscola = "#004aad"; // Variável para guardar a cor da escola

    async function iniciarApp() {
        try {
            // Busca as Configurações
            const respostaConfig = await fetch(API_URL + "?aba=Configuracoes_Gerais");
            const dadosConfig = await respostaConfig.json();
            
            if(dadosConfig.length > 0) {
                const config = dadosConfig[0];
                let linkImagem = config["Link da Logo"];
                
                // Se for link do Drive, adapta. Se não for, usa direto (imagem do GitHub)
                const idMatch = linkImagem.match(/\/d\/(.*?)\//);
                if (idMatch && idMatch[1]) {
                    linkImagem = `https://drive.google.com/uc?export=view&id=${idMatch[1]}`;
                }

                let corNome = config["Cor Principal"].trim();
                const mapaCores = {
                    "Azul": "#004aad", "Verde": "#198754", "Vermelho": "#dc3545",
                    "Amarelo": "#ffc107", "Laranja": "#fd7e14", "Roxo": "#6f42c1", "Preto": "#212529"
                };
                corEscola = mapaCores[corNome] || corNome; 
                document.getElementById('cabecalho').style.backgroundColor = corEscola;
                document.getElementById('btn-voltar-cor').style.color = corEscola;

                document.getElementById('cabecalho').innerHTML = `
                    <img id="logo-escola" src="${linkImagem}" alt="Logo" onerror="this.src='https://via.placeholder.com/400x120?text=Logo+Retangular'">
                    <h1>${config["Nome da Escola"]}</h1>
                `;
            }

            // Busca os Botões do Menu
            const respostaMenu = await fetch(API_URL + "?aba=Menu_Configuracoes");
            const dadosMenu = await respostaMenu.json();
            
            const containerMenu = document.getElementById('menu-blocos');
            containerMenu.innerHTML = ""; 

            if(dadosMenu.length === 0) {
                containerMenu.innerHTML = "<p style='grid-column: span 2; text-align:center;'>Adicione botões na planilha para começar.</p>";
            } else {
                dadosMenu.forEach(botao => {
                    const divBloco = document.createElement('div');
                    divBloco.className = 'bloco';
                    
                    // AGORA O BOTÃO ABRE A NOVA TELA!
                    divBloco.onclick = () => abrirTela(botao["Aba de Destino"], botao["Tipo de Conteúdo"], botao["Ícone"] + " " + botao["Nome do Botão"]);
                    
                    divBloco.innerHTML = `
                        <div class="bloco-icone">${botao["Ícone"]}</div>
                        <div class="bloco-titulo">${botao["Nome do Botão"]}</div>
                    `;
                    containerMenu.appendChild(divBloco);
                });
            }
        } catch (erro) {
            document.getElementById('menu-blocos').innerHTML = "<p style='grid-column: span 2; text-align:center;'>Erro de conexão.</p>";
        }
    }

    // Função que esconde o menu e abre a tela de conteúdo
    async function abrirTela(nomeAba, tipoConteudo, tituloBotao) {
        document.getElementById('menu-blocos').style.display = 'none';
        document.getElementById('tela-conteudo').style.display = 'block';
        
        const container = document.getElementById('conteudo-dinamico');
        container.innerHTML = `<h2 class="titulo-tela">${tituloBotao}</h2><p style="text-align:center; color:#666;">Buscando dados na planilha...</p>`;

        try {
            const resposta = await fetch(API_URL + "?aba=" + nomeAba);
            const dados = await resposta.json();

            // Roteador: Decide como desenhar a tela dependendo do Tipo
            if (tipoConteudo === "Avisos") {
                desenharTelaAvisos(dados, container);
            } else {
                // Deixa preparado para os próximos blocos (Provas, Alunos, etc)
                container.innerHTML += `<p>O visual para o tipo "${tipoConteudo}" ainda será construído!</p>`;
            }
        } catch (erro) {
            container.innerHTML += `<p>Erro ao buscar os dados.</p>`;
        }
    }

    // Função específica para desenhar a lista de Avisos
    function desenharTelaAvisos(dados, container) {
        if(dados.length === 0) {
            container.innerHTML += "<p>Nenhum aviso publicado no momento.</p>";
            return;
        }

        let html = "";
        // O '.reverse()' faz o aviso mais novo (última linha da planilha) aparecer no topo!
        dados.reverse().forEach(aviso => {
            html += `
            <div class="cartao-aviso" style="border-left-color: ${corEscola}">
                <span class="aviso-data">📅 Publicado em: ${aviso["Data"] || "Data não informada"}</span>
                <p class="aviso-texto">${aviso["Mensagem"] || ""}</p>
                ${aviso["Link Anexo"] ? `<a href="${aviso["Link Anexo"]}" target="_blank" class="aviso-link">📎 Abrir Documento Anexo</a>` : ''}
            </div>`;
        });
        
        // Substitui o texto de "Buscando dados..." pelos avisos
        container.innerHTML = `<h2 class="titulo-tela">Últimas Novidades</h2>` + html;
    }

    // Função do botão Voltar
    function voltarMenu() {
        document.getElementById('tela-conteudo').style.display = 'none';
        document.getElementById('menu-blocos').style.display = 'grid';
    }

    iniciarApp();
</script>

</body>
</html>
