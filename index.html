<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - EE Mestra Aurora</title>
    <!-- Fonte moderna usada pelas maiores EdTechs -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #f3f4f6; color: #1f2937; }
        
        /* O Topo Dinâmico e Exclusivo */
        .top-section { 
            background: linear-gradient(135deg, var(--cor-primaria, #10b981) 0%, var(--cor-secundaria, #047857) 100%); 
            padding: 50px 20px 80px 20px; 
            border-bottom-left-radius: 40px; 
            border-bottom-right-radius: 40px;
            position: relative;
            text-align: center;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .header-top { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 25px; }
        #logo-escola { width: 70px; height: 70px; object-fit: contain; border-radius: 18px; background: white; padding: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .school-name { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.5px; }
        
        .greeting { font-size: 2.2rem; font-weight: 600; margin-bottom: 5px; line-height: 1.2; }
        .subtitle { font-size: 1rem; opacity: 0.9; font-weight: 300; }
        
        /* O Container Central que "quebra" a linha do cabeçalho */
        .main-container { max-width: 1000px; margin: -40px auto 40px auto; padding: 0 20px; position: relative; z-index: 10; }
        
        /* Busca Flutuante de Alta Conversão */
        .search-wrapper { 
            background: white; 
            border-radius: 100px; 
            padding: 8px 25px; 
            display: flex; 
            align-items: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            margin-bottom: 40px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .search-wrapper:focus-within { border-color: var(--cor-primaria, #10b981); transform: translateY(-2px); box-shadow: 0 15px 30px rgba(0,0,0,0.12); }
        .search-wrapper .material-symbols-rounded { color: #9ca3af; font-size: 1.5rem; }
        .search-wrapper input { 
            border: none; 
            outline: none; 
            width: 100%; 
            padding: 12px 15px; 
            font-size: 1.05rem; 
            color: #374151;
            font-weight: 500;
        }
        .search-wrapper input::placeholder { color: #9ca3af; font-weight: 400; }
        
        /* Área dos Módulos (Grid Moderno) */
        .section-header { font-size: 1.3rem; font-weight: 600; color: #1f2937; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-header span { color: var(--cor-primaria, #10b981); }
        
        #menu-blocos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        /* O Novo Card Arrojado */
        .modulo-card { 
            background: white; 
            border-radius: 20px; 
            padding: 24px; 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            text-decoration: none; 
            color: inherit;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border: 1px solid #f3f4f6;
        }
        .modulo-card::before {
            content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 4px;
            background: var(--cor-primaria, #10b981); opacity: 0; transition: opacity 0.3s;
        }
        .modulo-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 15px 30px -5px rgba(0,0,0,0.1); 
            border-color: transparent;
        }
        .modulo-card:hover::before { opacity: 1; }
        
        .card-icon-box { 
            width: 65px; height: 65px; 
            border-radius: 16px; 
            background: #f8fafc; 
            display: flex; justify-content: center; align-items: center;
            font-size: 2.2rem;
            flex-shrink: 0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .card-icon-box img { width: 45px; height: 45px; object-fit: contain; }
        
        .card-text { flex: 1; }
        .card-title { font-size: 1.15rem; font-weight: 600; color: #111827; margin-bottom: 4px; line-height: 1.3;}
        .card-subtitle { font-size: 0.85rem; color: #6b7280; }
        
        .card-action { color: #d1d5db; transition: color 0.3s; }
        .modulo-card:hover .card-action { color: var(--cor-primaria, #10b981); transform: translateX(3px); }

        /* Telas Internas (Documentos/Avisos) */
        #tela-conteudo { display: none; background: white; border-radius: 24px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn-voltar { 
            background: #f3f4f6; border: none; color: #4b5563; font-size: 0.95rem; font-weight: 600; 
            cursor: pointer; margin-bottom: 30px; display: inline-flex; align-items: center; gap: 8px; 
            padding: 10px 20px; border-radius: 12px; transition: all 0.2s; 
        }
        .btn-voltar:hover { background: #e5e7eb; color: #111827; }
        
        /* Filtros Elegantes */
        .filtros-container { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; background: #f9fafb; padding: 15px; border-radius: 16px; border: 1px solid #f3f4f6;}
        .filtro-select { padding: 12px 16px; border-radius: 10px; border: 1px solid #e5e7eb; flex: 1; min-width: 180px; font-size: 0.95rem; color: #374151; font-weight: 500; outline: none; cursor: pointer; background: white; transition: all 0.2s;}
        .filtro-select:focus { border-color: var(--cor-primaria, #10b981); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }
        
        /* Cartão de Documento */
        .cartao-doc { 
            display: flex; align-items: center; background: white; padding: 20px; border-radius: 16px; 
            border: 1px solid #e5e7eb; margin-bottom: 15px; text-decoration: none; transition: all 0.2s;
        }
        .cartao-doc:hover { border-color: var(--cor-primaria, #10b981); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .doc-icone { font-size: 2.5rem; margin-right: 20px; color: #9ca3af; }
        .cartao-doc:hover .doc-icone { color: var(--cor-primaria, #10b981); }
        .doc-info { flex: 1; }
        .doc-titulo { font-weight: 600; font-size: 1.1rem; color: #1f2937; margin-bottom: 8px; }
        .doc-tags { font-size: 0.8rem; display: flex; gap: 8px; flex-wrap: wrap; font-weight: 500;}
        .tag { background: #f3f4f6; color: #4b5563; padding: 4px 12px; border-radius: 8px; }

        #loading { text-align: center; padding: 50px; color: #6b7280; font-size: 1.1rem; grid-column: 1 / -1; font-weight: 500;}
        
        @media (max-width: 768px) {
            .top-section { padding: 40px 20px 70px 20px; }
            .greeting { font-size: 1.8rem; }
            .modulo-card { flex-direction: row; padding: 18px; }
            .card-icon-box { width: 55px; height: 55px; font-size: 1.8rem; }
            .main-container { margin-top: -30px; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Cabeçalho Único -->
    <div class="top-section" id="topo-dinamico">
        <div class="header-top">
            <div id="logo-container"></div>
            <div class="school-name" id="school-name">Carregando...</div>
        </div>
        <h1 class="greeting" id="texto-saudacao">Olá!</h1>
        <p class="subtitle">O que você precisa acessar hoje?</p>
    </div>

    <div class="main-container">
        <!-- Tela Principal -->
        <div id="tela-inicial">
            
            <div class="search-wrapper">
                <span class="material-symbols-rounded">search</span>
                <input type="text" id="input-pesquisa" placeholder="Pesquisar por murais, planos, documentos..." onkeyup="filtrarModulos()">
            </div>
            
            <div class="section-header">
                <span class="material-symbols-rounded">apps</span> 
                Módulos da Secretaria
            </div>
            
            <div id="menu-blocos">
                <div id="loading">Conectando aos servidores...</div>
            </div>
        </div>

        <!-- Telas Internas (Listas) -->
        <div id="tela-conteudo">
            <button class="btn-voltar" onclick="voltarMenu()">
                <span class="material-symbols-rounded">arrow_back</span> Voltar ao Painel
            </button>
            <div id="conteudo-dinamico"></div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxfewC2cAeLK3ULrRcOP72E0KUqoteBNgw2TI5GUOl4WFYhQLIQoJNOWsLOFMl-zOIQzg/exec";
    let documentosGlobais = []; 

    // Função que dá Bom dia/Boa tarde/Boa noite
    function definirSaudacao() {
        const hora = new Date().getHours();
        let saudacao = "Olá!";
        if (hora >= 5 && hora < 12) saudacao = "Bom dia!";
        else if (hora >= 12 && hora < 18) saudacao = "Boa tarde!";
        else saudacao = "Boa noite!";
        document.getElementById('texto-saudacao').innerText = saudacao;
    }

    async function iniciarApp() {
        definirSaudacao();
        
        try {
            const respostaConfig = await fetch(API_URL + "?aba=Configuracoes_Gerais");
            const dadosConfig = await respostaConfig.json();
            
            if(dadosConfig.length > 0) {
                const config = dadosConfig[0];
                let linkImagem = config["Link da Logo"];
                const idMatch = linkImagem.match(/\/d\/(.*?)\//);
                if (idMatch && idMatch[1]) { linkImagem = `https://drive.google.com/uc?export=view&id=${idMatch[1]}`; }

                // Sistema Inteligente de Cores da Escola
                let corNome = config["Cor Principal"] ? config["Cor Principal"].trim() : "Verde";
                const mapaCores = { 
                    "Azul": ["#2563eb", "#1d4ed8"], 
                    "Verde": ["#10b981", "#059669"], 
                    "Vermelho": ["#ef4444", "#b91c1c"], 
                    "Amarelo": ["#f59e0b", "#d97706"], 
                    "Laranja": ["#f97316", "#c2410c"], 
                    "Roxo": ["#8b5cf6", "#6d28d9"], 
                    "Preto": ["#374151", "#111827"] 
                };
                let cores = mapaCores[corNome] || mapaCores["Verde"];
                
                // Injeta as cores no CSS (Variáveis)
                document.documentElement.style.setProperty('--cor-primaria', cores[0]);
                document.documentElement.style.setProperty('--cor-secundaria', cores[1]);
                
                document.getElementById('school-name').innerText = config["Nome da Escola"] || "Painel Educacional";
                document.getElementById('logo-container').innerHTML = `<img id="logo-escola" src="${linkImagem}" alt="Logo" onerror="this.src='https://via.placeholder.com/120?text=Logo'">`;
            }

            const respostaMenu = await fetch(API_URL + "?aba=Menu_Configuracoes");
            const dadosMenu = await respostaMenu.json();
            
            const containerMenu = document.getElementById('menu-blocos');
            containerMenu.innerHTML = ""; 

            if(dadosMenu.length === 0) {
                containerMenu.innerHTML = "<p>Nenhum módulo configurado na planilha.</p>";
            } else {
                dadosMenu.forEach(botao => {
                    const divBloco = document.createElement('a');
                    divBloco.className = 'modulo-card';
                    divBloco.setAttribute('data-nome', botao["Nome do Botão"].toLowerCase());
                    
                    let strIcone = botao["Ícone"] ? botao["Ícone"].toString().trim() : "📂";
                    let iconeRenderizado = strIcone;
                    
                    // Checa se é imagem
                    if (strIcone.startsWith("http") || strIcone.toLowerCase().endsWith(".png") || strIcone.toLowerCase().endsWith(".jpg")) {
                        let link = strIcone;
                        const idMatch = link.match(/\/d\/(.*?)\//);
                        if (idMatch && idMatch[1]) link = `https://drive.google.com/uc?export=view&id=${idMatch[1]}`;
                        iconeRenderizado = `<img src="${link}" alt="Ícone">`;
                    }
                    
                    let isExterno = botao["Tipo de Conteúdo"] === "Link Externo";
                    
                    if (isExterno) {
                        divBloco.href = botao["Aba de Destino"];
                        divBloco.target = "_blank";
                    } else {
                        divBloco.href = "#";
                        divBloco.onclick = (e) => { e.preventDefault(); abrirTela(botao["Aba de Destino"], botao["Tipo de Conteúdo"], botao["Nome do Botão"]); };
                    }
                    
                    // Ícone dinâmico da seta baseada no tipo (link fora ou tela dentro)
                    let setaIcon = isExterno ? "open_in_new" : "chevron_right";
                    
                    divBloco.innerHTML = `
                        <div class="card-icon-box">${iconeRenderizado}</div>
                        <div class="card-text">
                            <div class="card-title">${botao["Nome do Botão"]}</div>
                            <div class="card-subtitle">${isExterno ? 'Acessar plataforma externa' : 'Visualizar documentos internos'}</div>
                        </div>
                        <div class="card-action"><span class="material-symbols-rounded">${setaIcon}</span></div>
                    `;
                    containerMenu.appendChild(divBloco);
                });
            }
        } catch (erro) {
            document.getElementById('menu-blocos').innerHTML = "<p style='color:red;'>Erro ao conectar com a base de dados.</p>";
        }
    }

    // Busca ao vivo
    function filtrarModulos() {
        let input = document.getElementById('input-pesquisa').value.toLowerCase();
        let cards = document.getElementsByClassName('modulo-card');
        for (let i = 0; i < cards.length; i++) {
            let nome = cards[i].getAttribute('data-nome');
            if (nome.includes(input)) { cards[i].style.display = "flex"; } 
            else { cards[i].style.display = "none"; }
        }
    }

    async function abrirTela(nomeAba, tipoConteudo, tituloBotao) {
        document.getElementById('tela-inicial').style.display = 'none';
        document.getElementById('tela-conteudo').style.display = 'block';
        
        const container = document.getElementById('conteudo-dinamico');
        container.innerHTML = `<h2 class="section-header" style="font-size:1.8rem; margin-bottom: 25px;">${tituloBotao}</h2><div id="loading">Sincronizando dados...</div>`;

        try {
            const resposta = await fetch(API_URL + "?aba=" + nomeAba);
            const dados = await resposta.json();

            if (tipoConteudo === "Documentos") {
                documentosGlobais = dados;
                desenharTelaDocumentos(container, tituloBotao);
            } else if (tipoConteudo === "Avisos") {
                 desenharTelaAvisos(dados, container, tituloBotao);
            } else {
                container.innerHTML = `<h2 class="section-header" style="font-size:1.8rem; margin-bottom: 25px;">${tituloBotao}</h2><p>Visual em construção.</p>`;
            }
        } catch (erro) { container.innerHTML += `<p style="color:red;">Falha ao carregar.</p>`; }
    }

    // Mantivemos a lógica perfeita que já tínhamos dos avisos e documentos
    function desenharTelaAvisos(dados, container, tituloBotao) {
        if(dados.length === 0) { container.innerHTML = `<h2 class="section-header" style="font-size:1.8rem;">${tituloBotao}</h2><p>Nenhum aviso no momento.</p>`; return; }
        let html = `<h2 class="section-header" style="font-size:1.8rem; margin-bottom: 25px;">${tituloBotao}</h2>`;
        dados.reverse().forEach(aviso => {
            html += `
            <div style="background: white; border-left: 4px solid var(--cor-primaria); padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-right: 1px solid #f3f4f6; border-top: 1px solid #f3f4f6; border-bottom: 1px solid #f3f4f6;">
                <span style="display: block; font-size: 0.85rem; color: #6b7280; margin-bottom: 8px; font-weight: 600;">📅 ${aviso["Data"] || ""}</span>
                <p style="font-size: 1.05rem; color: #374151; line-height: 1.5;">${aviso["Mensagem"] || ""}</p>
            </div>`;
        });
        container.innerHTML = html;
    }

    function desenharTelaDocumentos(container, tituloBotao) {
        if(documentosGlobais.length === 0) { container.innerHTML = `<h2 class="section-header" style="font-size:1.8rem;">${tituloBotao}</h2><p>Nenhum documento.</p>`; return; }

        const anos = [...new Set(documentosGlobais.map(d => d["Ano Escolar"]).filter(Boolean))].sort();
        const componentes = [...new Set(documentosGlobais.map(d => d["Componente Curricular"]).filter(Boolean))].sort();

        let htmlFiltros = `
        <h2 class="section-header" style="font-size:1.8rem; margin-bottom: 25px;">${tituloBotao}</h2>
        <div class="filtros-container">
            <select id="filtro-ano" class="filtro-select" onchange="aplicarFiltrosDocumentos()">
                <option value="Todos">🎓 Todos os Anos</option>
                ${anos.map(a => `<option value="${a}">${a}</option>`).join('')}
            </select>
            <select id="filtro-comp" class="filtro-select" onchange="aplicarFiltrosDocumentos()">
                <option value="Todos">🏷️ Todas as Matérias</option>
                ${componentes.map(c => `<option value="${c}">${c}</option>`).join('')}
            </select>
        </div>
        <div id="lista-documentos"></div>
        `;

        container.innerHTML = htmlFiltros;
        aplicarFiltrosDocumentos();
    }

    window.aplicarFiltrosDocumentos = function() {
        const valAno = document.getElementById('filtro-ano').value;
        const valComp = document.getElementById('filtro-comp').value;

        const docsFiltrados = documentosGlobais.filter(doc => {
            return (valAno === "Todos" || doc["Ano Escolar"] === valAno) && (valComp === "Todos" || doc["Componente Curricular"] === valComp);
        });

        let html = "";
        if(docsFiltrados.length === 0) { html = `<p style="text-align:center; padding: 20px; color: #6b7280;">Nenhum documento encontrado.</p>`; } 
        else {
            docsFiltrados.forEach(doc => {
                const linkTag = doc["Link do Google Drive"] ? `href="${doc["Link do Google Drive"]}" target="_blank"` : 'href="#"';
                html += `
                <a ${linkTag} class="cartao-doc">
                    <div class="doc-icone"><span class="material-symbols-rounded">description</span></div>
                    <div class="doc-info">
                        <div class="doc-titulo">${doc["Nome do Documento"] || "Documento"}</div>
                        <div class="doc-tags">
                            ${doc["Ano Escolar"] ? `<span class="tag">${doc["Ano Escolar"]}</span>` : ''}
                            ${doc["Componente Curricular"] ? `<span class="tag">${doc["Componente Curricular"]}</span>` : ''}
                        </div>
                    </div>
                </a>`;
            });
        }
        document.getElementById('lista-documentos').innerHTML = html;
    };

    function voltarMenu() {
        document.getElementById('tela-conteudo').style.display = 'none';
        document.getElementById('tela-inicial').style.display = 'block';
    }

    iniciarApp();
</script>

</body>
</html>
