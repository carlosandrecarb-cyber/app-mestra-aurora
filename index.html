<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - EE Mestra Aurora</title>
    <!-- Estilos para dar "cara de aplicativo" -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; color: #333; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 480px; min-height: 100vh; background-color: #ffffff; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        
        /* Cabeçalho */
        header { background-color: #004aad; color: white; padding: 20px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #logo-escola { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid white; margin-bottom: 10px; background-color: white;}
        header h1 { font-size: 1.2rem; font-weight: 600; }
        
        /* Área dos Blocos (Menu) */
        #menu-blocos { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .bloco { background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 15px; padding: 20px 10px; text-align: center; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .bloco:active { transform: scale(0.95); background-color: #e2e6ea; }
        .bloco-icone { font-size: 2.5rem; margin-bottom: 10px; }
        .bloco-titulo { font-size: 0.9rem; font-weight: 600; color: #495057; }
        
        /* Tela de Carregamento */
        #loading { text-align: center; padding: 50px; color: #6c757d; font-size: 0.9rem; grid-column: span 2;}
    </style>
</head>
<body>

<div id="app">
    <!-- O Cabeçalho será preenchido automaticamente -->
    <header id="cabecalho">
        <div id="loading-header">Carregando dados da escola...</div>
    </header>

    <!-- Onde os botões vão aparecer -->
    <div id="menu-blocos">
        <div id="loading">Conectando à planilha...</div>
    </div>
</div>

<script>
    // A SUA URL MÁGICA
    const API_URL = "https://script.google.com/macros/s/AKfycbxfewC2cAeLK3ULrRcOP72E0KUqoteBNgw2TI5GUOl4WFYhQLIQoJNOWsLOFMl-zOIQzg/exec";

    // Função para carregar tudo quando o app abre
    async function iniciarApp() {
        try {
            // 1. Busca as Configurações (Logo e Nome)
            const respostaConfig = await fetch(API_URL + "?aba=Configuracoes_Gerais");
            const dadosConfig = await respostaConfig.json();
            
            if(dadosConfig.length > 0) {
                const config = dadosConfig[0];
                // Transforma o link do Drive em link de imagem visível
                const linkImagem = config["Link da Logo"].replace('/view?usp=sharing', '/preview');
                
                document.getElementById('cabecalho').innerHTML = `
                    <img id="logo-escola" src="${linkImagem}" alt="Logo da Escola">
                    <h1>${config["Nome da Escola"]}</h1>
                `;
            }

            // 2. Busca os Botões do Menu
            const respostaMenu = await fetch(API_URL + "?aba=Menu_Configuracoes");
            const dadosMenu = await respostaMenu.json();
            
            const containerMenu = document.getElementById('menu-blocos');
            containerMenu.innerHTML = ""; // Limpa a tela de carregamento

            if(dadosMenu.length === 0) {
                containerMenu.innerHTML = "<p style='grid-column: span 2; text-align:center;'>Nenhum bloco cadastrado na planilha ainda.</p>";
            } else {
                // Desenha cada botão na tela
                dadosMenu.forEach(botao => {
                    const divBloco = document.createElement('div');
                    divBloco.className = 'bloco';
                    divBloco.onclick = () => alert("Você clicou em: " + botao["Nome do Botão"] + "\nEm breve isso abrirá a aba: " + botao["Aba de Destino"]);
                    
                    divBloco.innerHTML = `
                        <div class="bloco-icone">${botao["Ícone"]}</div>
                        <div class="bloco-titulo">${botao["Nome do Botão"]}</div>
                    `;
                    containerMenu.appendChild(divBloco);
                });
            }

        } catch (erro) {
            document.getElementById('menu-blocos').innerHTML = "<p>Erro ao conectar com a planilha. Verifique a internet.</p>";
            console.error(erro);
        }
    }

    // Roda a função principal
    iniciarApp();
</script>

</body>
</html>
