<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Escola</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; color: #333; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 480px; min-height: 100vh; background-color: #ffffff; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        
        /* Cabeçalho */
        header { background-color: #004aad; color: white; padding: 20px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: background-color 0.5s; }
        
        /* O SEGREDO DO BANNER RETANGULAR ESTÁ AQUI */
        #logo-escola { 
            width: 100%; /* Ocupa a largura disponível */
            max-width: 400px; /* Mas não deixa ficar gigante */
            height: auto; 
            max-height: 130px; /* Limite de altura */
            object-fit: contain; /* Garante que não vai cortar nenhuma letra */
            border-radius: 8px; /* Bordas levemente arredondadas */
            margin-bottom: 12px; 
            background-color: white; /* Fundo branco para destacar no verde */
            padding: 5px; /* Uma margem interna bonitinha */
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); /* Sombra elegante */
        }
        
        header h1 { font-size: 1.3rem; font-weight: 600; }
        
        /* Área dos Blocos */
        #menu-blocos { padding: 25px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .bloco { background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 15px; padding: 25px 10px; text-align: center; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .bloco:active { transform: scale(0.95); background-color: #e2e6ea; }
        .bloco-icone { font-size: 2.8rem; margin-bottom: 12px; }
        .bloco-titulo { font-size: 0.95rem; font-weight: 600; color: #495057; }
        
        #loading { text-align: center; padding: 50px; color: #6c757d; font-size: 1rem; grid-column: span 2;}
    </style>
</head>
<body>

<div id="app">
    <header id="cabecalho">
        <div id="loading-header">Carregando dados...</div>
    </header>

    <div id="menu-blocos">
        <div id="loading">Conectando à planilha...</div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxfewC2cAeLK3ULrRcOP72E0KUqoteBNgw2TI5GUOl4WFYhQLIQoJNOWsLOFMl-zOIQzg/exec";

    async function iniciarApp() {
        try {
            // 1. Busca as Configurações
            const respostaConfig = await fetch(API_URL + "?aba=Configuracoes_Gerais");
            const dadosConfig = await respostaConfig.json();
            
            if(dadosConfig.length > 0) {
                const config = dadosConfig[0];
                
                let linkImagem = config["Link da Logo"];
                const idMatch = linkImagem.match(/\/d\/(.*?)\//);
                if (idMatch && idMatch[1]) {
                    linkImagem = `https://drive.google.com/uc?export=view&id=${idMatch[1]}`;
                }

                let corNome = config["Cor Principal"].trim();
                const mapaCores = {
                    "Azul": "#004aad",
                    "Verde": "#198754", 
                    "Vermelho": "#dc3545",
                    "Amarelo": "#ffc107",
                    "Laranja": "#fd7e14",
                    "Roxo": "#6f42c1",
                    "Preto": "#212529"
                };
                const corFinal = mapaCores[corNome] || corNome; 
                document.getElementById('cabecalho').style.backgroundColor = corFinal;

                document.getElementById('cabecalho').innerHTML = `
                    <img id="logo-escola" src="${linkImagem}" alt="Logo" onerror="this.src='https://via.placeholder.com/400x120?text=Logo+Retangular'">
                    <h1>${config["Nome da Escola"]}</h1>
                `;
            }

            // 2. Busca os Botões
            const respostaMenu = await fetch(API_URL + "?aba=Menu_Configuracoes");
            const dadosMenu = await respostaMenu.json();
            
            const containerMenu = document.getElementById('menu-blocos');
            containerMenu.innerHTML = ""; 

            if(dadosMenu.length === 0) {
                containerMenu.innerHTML = "<p style='grid-column: span 2; text-align:center;'>Adicione botões na planilha para começar.</p>";
            } else {
                dadosMenu.forEach(botao => {
                    const divBloco = document.createElement('div');
                    divBloco.className = 'bloco';
                    divBloco.onclick = () => alert("Futura tela: " + botao["Aba de Destino"]);
                    
                    divBloco.innerHTML = `
                        <div class="bloco-icone">${botao["Ícone"]}</div>
                        <div class="bloco-titulo">${botao["Nome do Botão"]}</div>
                    `;
                    containerMenu.appendChild(divBloco);
                });
            }
        } catch (erro) {
            document.getElementById('menu-blocos').innerHTML = "<p style='grid-column: span 2; text-align:center;'>Erro de conexão.</p>";
            console.error(erro);
        }
    }

    iniciarApp();
</script>

</body>
</html>
